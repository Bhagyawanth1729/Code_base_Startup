version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgestock-postgres
    environment:
      POSTGRES_USER: forgestock
      POSTGRES_PASSWORD: forgestock
      POSTGRES_DB: forgestock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgestock -d forgestock"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgestock-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forgestock-api
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgres://forgestock:forgestock@postgres:5432/forgestock?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: development-secret-change-in-production
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h
      LOG_LEVEL: debug
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_RPS: 100
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forgestock-worker
    command: ./forgestock-worker
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgres://forgestock:forgestock@postgres:5432/forgestock?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: development-secret-change-in-production
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: